skip_lfs: true

commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - run: bun run lint
    - run: docker compose run --rm -T hadolint hadolint Dockerfile
    - run: docker build .

pre-commit:
  parallel: true
  jobs:
    - run: bun run lint:fix .
      glob: "*"
      stage_fixed: true
    - run: docker compose run --rm -T hadolint hadolint Dockerfile
      glob: "Dockerfile"
    - run: docker build .
      glob: "Dockerfile"
