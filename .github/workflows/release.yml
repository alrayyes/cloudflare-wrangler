# Nobody picks a version. release-please reads the Conventional Commits that land on
# main and keeps a release pull request open carrying the next version and the
# changelog entry; merging that pull request tags the release and writes the notes.
# The same run then builds the image and pushes it to ghcr.io.
#
# One workflow rather than two, because a tag pushed with GITHUB_TOKEN starts no
# further workflow run - GitHub refuses, to stop recursive runs. A separate on-tag
# workflow would silently never fire, and the first symptom is a release with no
# image against it.
#
# This replaces release-it, which published to a GitLab instance that no longer
# exists, from an image in a registry that was garbage-collected out from under it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can leave a
# tag pushed with nothing published against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what, if anything, is being released. Most runs only refresh the
  # release pull request; the run that matters is the one where that pull request
  # was what just landed.
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # pushes the image to ghcr.io
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch. They are the same commit right now, but naming
          # the tag is what makes this reproducible if main moves mid-run.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # GITHUB_TOKEN, not a minted secret. This is the whole reason the image moved
      # here: Forgejo's automatic per-run token authenticates against its registry and
      # is then refused write:package, so publishing there needed a hand-made user
      # token that had to be rotated by hand as well.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          pull: true
          # The version, and `latest` for consumers that track the tip. vps-docker
          # pins the digest and lets Renovate move it, so `latest` there is a name
          # for the digest rather than a floating reference.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest

      # Says, verifiably, that this digest came out of this workflow at this commit.
      # `docker buildx imagetools inspect` will not tell you that; a consumer can
      # check it with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
